# this relaunch is the owner's call over that ruling. Why the winner is still useful: the task is a drop-in, the exact
# HTML marked renders, and no public renderer is one. markdown-it, micromark, commonmark.js, pulldown-cmark and md4c
# each render their own HTML (other escapes, other list and table markup, other edge cases), so a site that renders
# with marked cannot swap one in without changing its pages; the best public way to render marked's HTML is marked
# itself, the house baseline here, and a prize needs beating it at 95% confidence.
#
#   generator/          node22, sealed (generator_sha256): draws a set of cases from /input/seed.json (a drand
#                       round's seed, server/competitions/instance.ts) into /output/input/cases.json (every
#                       CommonMark 0.31.2 and GFM 0.29 extension example, spec/examples.json, and 40 generated
