      - "Prizes: $50 for 1st place, $35 for 2nd, $25 for 3rd, $10 each for 4th to 10th and $7 each for 11th to 20th, one place per entrant, paid by the house in USDC on Solana; a paid place a house bot holds is not awarded, and no entry moves up to take it"
      - "Beat the baseline: a prize goes only to an entry faster than marked itself, the house baseline, in the final heat at 95% confidence, one-sided, over the repeated runs; an entry that is not keeps its rank, and a place no prize-eligible entry takes is not awarded"
      - "Transcripts: strict; an entry is valid only with the sealed recordings of the agent sessions that built it, which the site witnessed live"
