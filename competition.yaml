#                       exactly, and writes {passed, cases_passed, cases_total} with a checks row per spec section and
#                       per document
#   baseline/           the house baseline: marked itself (the same two vendored files) behind main.ts and parse.js;
#                       house.yaml names it, so the automation enters it 4 hours before the deadline, never at the
