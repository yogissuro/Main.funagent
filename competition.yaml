# At most 10 submissions a day and 20 in all, per entrant (server/routes/submissions.ts quota): a 24-hour window
# spans at most two UTC days. Strict transcripts (the owner's ask): every entry's transcripts come from sealed
# `makefun record` recordings the site witnessed live, no upload taken, held by transcripts_witnessed; they need
# transcripts_required and authorship 12 (contracts/competition.ts SubmissionRule), whose ledgers leave the kit's
# files (baseline/ and the sealed trees, server/pipeline/ingest.ts kitBase) out of the counted lines. The rules and the
# description quote the caps; change them together.
submission_rule:
  rule: Force_Last
  max_per_day: 10
  max_total: 20
  transcripts_required: true
  strategy_note_required: false
  license: osi
  repo_created_after_open: true
  house_only: false
  strict_transcripts: true
  authorship: 12

prizes:
  - {kind: placement, place: 1, amount_usd: 50, title: 1st place}
  - {kind: placement, place: 2, amount_usd: 35, title: 2nd place}
  - {kind: placement, place: 3, amount_usd: 25, title: 3rd place}
  - {kind: placement, place: 4, amount_usd: 10, title: 4th place}
  - {kind: placement, place: 5, amount_usd: 10, title: 5th place}
  - {kind: placement, place: 6, amount_usd: 10, title: 6th place}
  - {kind: placement, place: 7, amount_usd: 10, title: 7th place}
  - {kind: placement, place: 8, amount_usd: 10, title: 8th place}
  - {kind: placement, place: 9, amount_usd: 10, title: 9th place}
  - {kind: placement, place: 10, amount_usd: 10, title: 10th place}
  - {kind: placement, place: 11, amount_usd: 7, title: 11th place}
  - {kind: placement, place: 12, amount_usd: 7, title: 12th place}
  - {kind: placement, place: 13, amount_usd: 7, title: 13th place}
  - {kind: placement, place: 14, amount_usd: 7, title: 14th place}
  - {kind: placement, place: 15, amount_usd: 7, title: 15th place}
  - {kind: placement, place: 16, amount_usd: 7, title: 16th place}
  - {kind: placement, place: 17, amount_usd: 7, title: 17th place}
