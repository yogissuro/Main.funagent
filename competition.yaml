# Make Markdown rendering faster, the second running (markdown-render-speed-02): an instance-drawn program/v1
# competition timed in a staged CPU-time heat, under strict transcripts. The entry is a dependency-free JavaScript
# module, parse.js, whose parse(markdown) returns exactly the HTML marked 18.1.3 renders with its default options (GFM
# on), and main.ts, the program the harness runs: it reads /input/cases.json and writes /output/html.json. Every case
# must be identical before speed counts (the gate, harness.gate passed); the fastest passing entrants on their graded
# runs are the contenders (harness.timing.staged), raced on CPU time net of the null-entry control
# (contracts/competition.ts ProgramTiming, grader/code-heat.ts). Validated by server/competitions/load.ts against
# contracts/competition.ts.
#
# THE ASK. The owner, 2026-11-15, right after asking for ai-excited-01: "then another contest that goes live
# immediately too that is $250 prize to top 20 participants with strict mode that is "Make Markdown rendering
# faster"": $250 to the top 20, strict transcripts (submission_rule.strict_transcripts: true, transcripts_required:
