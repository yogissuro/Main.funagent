  - {kind: placement, place: 19, amount_usd: 7, title: 19th place}
  - {kind: placement, place: 20, amount_usd: 7, title: 20th place}

# A house entry holds the place it finishes in, unpaid, and no entry moves up (the owner; the Prizes section says so).
house_holds_places: true

limits:
  cpus: 1
  memory_mb: 1024
  pids: 64
  wall_budget_sec: 20

# The efficiency view's authorship gate (bot-01's 0.80): no prize rides on that view.
min_authored_coverage: 0.8

# A placement prize needs a CPU time faster than every published house baseline's (the gate baseline: the
# best value among the phase's ranked entries flagged baseline, marked itself here, entered by house.yaml 4 hours
# before the deadline) at 95% confidence, one-sided, by the heat's interval of the difference of their trimmed means
# (server/payouts/baseline.ts codeGateInterval): an entry that is not keeps its rank but is not prize-eligible, and a
# place no eligible entry takes is not awarded. The rules text quotes it.
prize_requires_beating_baseline: true

# Full auto: the lock, the scored draw, the grades, the contenders' cut, the heat, the publication and the resolve;
# autopay. Its escrow is funded at the deploy that seeds it open (escrow: at_open), within a minute and before entries
# open, as the btc-race release template's is: payouts auto then pays from the reward wallet only when that escrow was
# never funded (server/competitions/load.ts escrowAtOpenIssues, escrowPayoutsIssue). The final starts 10 minutes
# (COMMIT_WINDOW_WARN_SECONDS) after the deadline, the commit window the escrow's entries root needs.
automation:
  lifecycle: true
  payouts: auto
  escrow: at_open
